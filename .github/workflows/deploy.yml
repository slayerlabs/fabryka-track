name: Test and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test,eval,corpus]'
      - name: Python tests
        run: python -m pytest
      - name: Website tests
        run: node --test tests/navigation.test.cjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check that this is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - name: Configure restricted deployment key
        if: steps.current.outputs.deploy == 'true'
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/track_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/track_deploy ~/.ssh/known_hosts
      - name: Deploy the tested commit
        if: steps.current.outputs.deploy == 'true'
        run: |
          set -o pipefail
          git archive --format=tar HEAD | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i ~/.ssh/track_deploy root@70.34.245.254 "deploy $GITHUB_SHA"
      - name: Verify public release
        if: steps.current.outputs.deploy == 'true'
        run: |
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 https://track.fabryka.ai/health |
            python -c 'import json,os,sys; d=json.load(sys.stdin); assert d["status"]=="ok" and d["release"]==os.environ["GITHUB_SHA"], d'
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/track_deploy ~/.ssh/known_hosts
