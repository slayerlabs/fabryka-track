name: Test and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: python-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: '3.12'
      - name: Restore installed CPU test environment
        id: environment
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-venv
          key: cpu-test-env-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.github/workflows/deploy.yml') }}
      - name: Install CPU test dependencies on cache miss
        if: steps.environment.outputs.cache-hit != 'true'
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          .ci-venv/bin/python -m pip install hatchling '.[test,eval,corpus]'
      - name: Install current application without resolving dependencies
        run: |
          .ci-venv/bin/python -m pip install --no-deps --no-build-isolation .
          .ci-venv/bin/python -m pip check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React frontend once
        working-directory: frontend
        run: npm ci && npm run build
      - name: Website tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Python tests
        run: .ci-venv/bin/python -m pytest --durations=10
      - name: Package the tested release
        run: |
          git archive --format=tar --output=release.tar HEAD
          tar -rf release.tar src/fabryka_track/web
      - name: Upload immutable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: release.tar
          if-no-files-found: error
          retention-days: 3
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Download the tested release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
      - name: Check that this is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - name: Configure restricted deployment key
        if: steps.current.outputs.deploy == 'true'
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/track_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/track_deploy ~/.ssh/known_hosts
      - name: Deploy the tested commit
        if: steps.current.outputs.deploy == 'true'
        run: |
          set -o pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i ~/.ssh/track_deploy root@70.34.245.254 "deploy $GITHUB_SHA" < release.tar
      - name: Verify public release
        if: steps.current.outputs.deploy == 'true'
        run: |
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 https://track.fabryka.ai/health |
            python -c 'import json,os,sys; d=json.load(sys.stdin); assert d["status"]=="ok" and d["release"]==os.environ["GITHUB_SHA"], d'
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/track_deploy ~/.ssh/known_hosts
