[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabryka"
version = "0.3.0"
description = "Fabryka SaaS experiment tracking SDK and self-hosted tracking server"
readme = "README.sdk.md"
license = {text = "MIT"}
authors = [{name = "Fabryka Labs"}]
keywords = ["experiment-tracking", "machine-learning", "llm", "training"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
server = [
  "argon2-cffi>=23.1", "fastapi>=0.115", "huggingface-hub>=1.0,<2",
  "safetensors>=0.4", "numpy>=1.24", "pydantic-settings>=2.5",
  "python-multipart>=0.0.12", "sqlalchemy>=2.0", "torch>=2.4",
  "uvicorn>=0.30", "datasets>=4,<5", "tiktoken>=0.9,<1",
]
corpus = ["pyarrow>=15"]
postgres = ["psycopg[binary]>=3.2"]
r2 = ["boto3>=1.35"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
eval = [
    "lm-eval==0.4.13",
]

[project.scripts]
fabryka-track = "fabryka_track.cli:main"
fabryka-goal-engine = "fabryka_track.goal_engine:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fabryka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
