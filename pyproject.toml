[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabryka-track"
version = "0.1.0"
description = "Reliable, intentionally small experiment tracking"
requires-python = ">=3.10"
dependencies = [
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "huggingface-hub>=1.0,<2",
  "safetensors>=0.4",
  "numpy>=1.24",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "torch>=2.4",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
r2 = ["boto3>=1.35"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
eval = [
    "lm-eval==0.4.13",
]

[project.scripts]
fabryka-track = "fabryka_track.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fabryka_track"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

