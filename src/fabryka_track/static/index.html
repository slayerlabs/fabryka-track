<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Training studio · Fabryka Track</title>
    <style>
      :root {
        --bg: #f5f3ed;
        --paper: #fffefa;
        --ink: #292b25;
        --muted: #74766c;
        --line: #dedfd5;
        --accent: #a84d33;
        --green: #527660;
        --blue: #647d96;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 4px;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      a {
        color: inherit;
      }
      header {
        height: 82px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5vw;
        background: var(--paper);
      }
      .brand {
        font-weight: 750;
        letter-spacing: -0.6px;
        text-decoration: none;
        font-size: 19px;
      }
      .brand span {
        color: var(--accent);
        margin-right: 10px;
      }
      nav {
        display: flex;
        gap: 25px;
      }
      nav a {
        text-decoration: none;
        color: var(--muted);
        padding: 29px 0;
      }
      nav a.active {
        color: var(--ink);
        border-bottom: 2px solid var(--accent);
      }
      main {
        max-width: 1160px;
        padding: 45px 30px 60px;
        margin: auto;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font:
          normal clamp(32px, 4vw, 45px) Georgia,
          serif;
        letter-spacing: -1.5px;
        margin-bottom: 12px;
      }
      h2 {
        font:
          normal 26px Georgia,
          serif;
        letter-spacing: -0.5px;
      }
      h3 {
        font-size: 16px;
      }
      p {
        line-height: 1.6;
      }
      .muted,
      small {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 15px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .intro {
        margin-bottom: 32px;
      }
      .steps {
        display: flex;
        border-bottom: 1px solid var(--line);
        margin-bottom: 30px;
        gap: 36px;
      }
      .step {
        padding: 0 0 18px;
        color: var(--muted);
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
      }
      .step.active {
        color: var(--accent);
        border-color: var(--accent);
      }
      .step b {
        display: inline-grid;
        place-items: center;
        width: 25px;
        height: 25px;
        border: 1px solid var(--line);
        border-radius: 50%;
        margin-right: 9px;
        font-size: 12px;
      }
      .step.active b {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 24px;
        align-items: start;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 26px;
      }
      .panel + .panel {
        margin-top: 18px;
      }
      .aside {
        position: sticky;
        top: 24px;
      }
      .dataset {
        padding: 23px 0;
        border-top: 1px solid var(--line);
      }
      .dataset:first-child {
        border: 0;
      }
      .dataset h3 {
        margin: 0 0 5px;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 9px;
      }
      .dataset input[type="range"] {
        width: 100%;
        margin: 19px 0 5px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .percent {
        font-size: 24px;
        font-variant-numeric: tabular-nums;
      }
      .stack {
        display: flex;
        overflow: hidden;
        height: 12px;
        background: var(--line);
        border-radius: 5px;
        margin: 20px 0;
      }
      .stack span {
        transition: width 0.15s;
      }
      .legend {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        font-size: 13px;
        gap: 10px;
      }
      .divider {
        border-top: 1px solid var(--line);
        margin: 20px 0;
      }
      .primary,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border-radius: 7px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      .primary {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: white;
      }
      .secondary {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .wide {
        width: 100%;
      }
      .upload {
        padding: 18px;
        border: 1px dashed #b7b9ae;
        border-radius: 8px;
        margin-top: 12px;
        display: flex;
        gap: 15px;
        align-items: center;
        justify-content: space-between;
      }
      .upload p {
        font-size: 13px;
        margin: 3px 0;
      }
      .field {
        display: block;
        margin-bottom: 23px;
      }
      .field > span {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 9px;
      }
      input:not([type="range"]):not([type="checkbox"]),
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cfd1c5;
        border-radius: 6px;
        background: white;
        color: var(--ink);
      }
      .field small {
        display: block;
        line-height: 1.5;
        margin-top: 7px;
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .choice {
        padding: 20px;
        border: 1px solid var(--green);
        background: #f3f6ef;
        border-radius: 8px;
        margin-bottom: 25px;
      }
      .choice h3 {
        margin: 0 0 7px;
      }
      .choice p {
        font-size: 13px;
        margin: 0;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        display: inline-block;
        padding: 5px 8px;
        border-radius: 4px;
        background: #eceee6;
        color: var(--green);
        white-space: nowrap;
      }
      .badge.failed,
      .badge.interrupted {
        color: #a13e30;
        background: #f8e4df;
      }
      .badge.running {
        background: #e3efdf;
      }
      .badge.queued,
      .badge.stopping {
        color: #866426;
        background: #f5eddc;
      }
      .notice {
        background: #eeeee5;
        padding: 13px 16px;
        border-radius: 7px;
        color: #656856;
        font-size: 13px;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 28px;
      }
      .error {
        color: #9c352a;
        background: #fbeae5;
        border: 1px solid #e9c0b8;
        padding: 14px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin: 24px 0;
      }
      .metric {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 20px;
      }
      .metric small {
        display: block;
        margin-bottom: 10px;
      }
      .metric strong {
        font-size: 26px;
        font-weight: 500;
        letter-spacing: -0.6px;
      }
      .charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .chart {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 22px;
        min-width: 0;
      }
      .chart h3 {
        margin: 0 0 16px;
      }
      .chart > svg {
        width: 100%;
        height: auto;
      }
      .empty {
        text-align: center;
        padding: 55px 20px;
      }
      .empty h2 {
        margin-bottom: 10px;
      }
      .run-list {
        display: grid;
        gap: 12px;
      }
      .run-item {
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 20px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .run-item > a {
        flex: 1;
        text-decoration: none;
      }
      .run-item h3 {
        margin: 0 0 6px;
      }
      .run-item input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        line-height: 1.7;
        max-height: 230px;
        overflow: auto;
        margin: 0;
      }
      details {
        margin-top: 22px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 17px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding: 22px 5vw;
        font-size: 12px;
        color: var(--muted);
      }
      .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        padding: 12px 22px;
        border-radius: 8px;
        z-index: 5;
      }
      .table-scroll {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      td,
      th {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      progress {
        width: 100%;
        height: 8px;
        accent-color: var(--green);
      }
      @media (max-width: 760px) {
        header {
          min-height: 65px;
          height: auto;
          flex-wrap: wrap;
          gap: 8px;
          padding: 12px 20px;
        }
        .brand {
          font-size: 16px;
        }
        nav {
          flex-wrap: wrap;
          gap: 16px;
        }
        nav a {
          padding: 8px 0;
          font-size: 13px;
        }
        main {
          padding: 28px 18px;
        }
        .layout,
        .charts {
          grid-template-columns: 1fr;
        }
        .aside {
          position: static;
        }
        .metrics {
          grid-template-columns: 1fr 1fr;
        }
        .steps {
          gap: 14px;
        }
        .step {
          font-size: 12px;
        }
        .step b {
          margin-right: 4px;
        }
        .panel {
          padding: 20px;
        }
        .intro.row {
          align-items: start;
          flex-wrap: wrap;
        }
        .run-item {
          gap: 10px;
        }
        .run-item .loss-label {
          display: none;
        }
        .fields {
          grid-template-columns: 1fr;
        }
        .upload {
          flex-wrap: wrap;
        }
        footer {
          gap: 20px;
        }
        .percent {
          font-size: 21px;
        }
      }
      .character { border:1px solid var(--line); padding:24px; margin-bottom:24px; }
      .character h2 { margin:10px 0 20px; }
      .character-buttons { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
      .character-buttons button { border:1px solid #bbb5ad; border-radius:0; padding:13px 16px; background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
      .character-buttons button:hover, .character-buttons button:focus-visible { border-color:var(--accent); color:var(--accent); }
      .character-buttons button[aria-pressed="true"] { background:#1b1815; border-color:#1b1815; color:white; }
      .dataset[data-empty="true"] h3, .dataset[data-empty="true"] .percent { color:var(--muted); }
      .source-category { display:flex; align-items:center; gap:10px; margin:10px 0; font-size:12px; color:var(--muted); }
      .source-category select { width:auto; max-width:100%; padding:5px 8px; }
      @media(max-width:600px) { .character { padding:16px; } .character-buttons button { flex:1 1 140px; } }
      .point-shelf { display:grid; grid-template-columns:repeat(20,minmax(0,1fr)); gap:5px; padding:16px 0 8px; border-bottom:5px solid #d3c6b5; margin:0 0 20px; }
      .point-book { min-width:0; height:70px; background:linear-gradient(90deg,#0003 0 12%,transparent 13%),var(--book-color); border-radius:2px 4px 4px 2px; box-shadow:2px 2px 0 #0002; display:flex; align-items:flex-end; justify-content:center; padding-bottom:7px; color:#fff; font-size:10px; font-weight:700; }
      .point-book.empty { background:transparent; border:1px dashed #c9c4bb; box-shadow:none; color:var(--muted); }
      .dataset-cover { width:66px; height:86px; flex:0 0 66px; border-radius:2px 5px 5px 2px; background:linear-gradient(90deg,#0003 0 9%,transparent 10%),var(--book-color); color:#fff; box-shadow:3px 3px 0 #0002; display:flex; flex-direction:column; justify-content:space-between; padding:10px 8px 10px 13px; text-align:left; }
      .dataset-cover b { font:26px Georgia,serif; color:white; }
      .dataset-cover small { color:#fff; font-size:8px; letter-spacing:1px; }
      .dataset-heading { display:flex; align-items:center; gap:18px; }
      @media(max-width:600px) { .point-shelf {grid-template-columns:repeat(10,minmax(0,1fr));} .point-book {height:55px;} .dataset-cover {width:44px;flex-basis:44px;height:64px;padding:8px;} .dataset-cover b {font-size:20px;} .dataset-cover small {font-size:6px;} .dataset-heading {gap:10px;} .dataset .percent {font-size:18px;} }
      .book-reader { width:min(850px,calc(100vw - 32px)); max-height:85vh; padding:28px; border:1px solid var(--line); border-radius:12px; background:var(--paper); color:var(--ink); }
      .book-reader::backdrop { background:#201b16aa; }
      .book-reader pre { white-space:pre-wrap; overflow-wrap:anywhere; padding:20px; background:#f6f2e9; max-height:45vh; overflow:auto; font:16px/1.7 Georgia,serif; }
      .book-reader .reader-controls { display:flex; flex-wrap:wrap; gap:10px; margin:16px 0; }
      .compact-dataset { display:grid; grid-template-columns:minmax(210px,1fr) minmax(220px,1fr); align-items:center; gap:16px; padding:13px 0; }
      .compact-dataset .dataset-heading {gap:12px;min-width:0;}
      .compact-dataset .dataset-cover {width:42px;flex-basis:42px;height:57px;padding:8px 6px 6px 10px;}
      .compact-dataset .dataset-cover b {font-size:20px;}
      .compact-dataset .dataset-cover small {font-size:6px;}
      .dataset-title {min-width:0;}
      .dataset-title h3 {font-size:15px;margin:0 0 3px;overflow-wrap:anywhere;}
      .dataset-title small {font-size:11px;line-height:1.4;display:block;}
      .preview-link {border:0;background:none;padding:3px 0;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;text-align:left;}
      .preview-link:hover {text-decoration:underline;}
      .dataset-controls {display:grid;grid-template-columns:28px minmax(50px,1fr) 28px 100px;gap:8px;align-items:center;}
      .dataset-controls input[type=range] {margin:0;width:100%;}
      .point-control {height:28px;width:28px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font-size:18px;cursor:pointer;}
      .point-control:disabled {opacity:.35;cursor:default;}
      .compact-dataset .percent {font-size:15px;white-space:nowrap;text-align:right;}
      .character {padding:18px;margin-bottom:16px;}
      .character h2 {font-size:27px;margin:8px 0 12px;}
      .character-buttons {gap:8px;margin-bottom:10px;}
      .character-buttons button {padding:8px 12px;font-size:14px;}
      .point-shelf {padding-top:8px;margin-bottom:12px;}
      .point-book {height:48px;}
      .upload {padding:16px;margin-top:16px;}
      @media(max-width:700px) { .compact-dataset {grid-template-columns:1fr;gap:8px;} .dataset-controls {grid-template-columns:28px minmax(60px,1fr) 28px 100px;} }
      main:has(.studio-intro) {padding-top:20px;}
      .studio-intro {margin-bottom:8px;}
      .studio-intro .eyebrow {display:none;}
      .studio-intro h1 {font-size:28px;margin:0 0 6px;}
      .studio-intro p {font-size:13px;margin:0;}
      .studio-steps {margin:12px 0 18px;}
      .studio-steps .step {font-size:13px;padding:10px 0;}
      .studio-steps .step b {width:24px;height:24px;font-size:12px;}
      #workspace {padding:20px;}
      #workspace > .character {padding:0 0 12px;border:0;border-bottom:1px solid var(--line);}
      #workspace > .character .eyebrow {font-size:10px;margin-bottom:4px;}
      #workspace > .character h2 {font-size:22px;margin:4px 0 10px;}
      #workspace > .character > small {display:none;}
      #character-status {font-size:11px;margin:6px 0;}
      .studio-sidebar {position:sticky;top:18px;align-self:start;display:grid;gap:12px;}
      .studio-sidebar .aside {position:static;margin:0;padding:20px;}
      #studio-next:empty {display:none;}
      #studio-next .primary {width:100%;text-align:center;padding:12px 16px;}
      #chinchilla-fold {padding:14px;font-size:12px;}
      #chinchilla-fold .character {padding:12px 0 0;border:0;margin:0;}
      #chinchilla-fold .fields {grid-template-columns:1fr;gap:8px;}
      #chinchilla-fold input {padding:8px;}
      #chinchilla-fold h2 {font-size:20px;}
      #chinchilla-fold .character-buttons button {font-size:12px;padding:5px 8px;}
      @media(max-width:900px) { .studio-sidebar {position:static;} }
      @media(max-width:760px) { #studio-next:not(:empty) {position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--paper,#fff);padding:10px 16px;box-shadow:0 -2px 12px #0001;} main:has(.studio-intro) {padding-bottom:85px;} }

      .chart {position:relative;min-width:0;padding:16px 14px 10px;background:#fff;border:1px solid #e0e4e7;border-radius:8px;box-shadow:0 1px 2px #19212a04;}
      .chart h3 {font-family:inherit;font-size:13px;font-weight:600;color:#29313b;margin:0 2px 4px;letter-spacing:0;}
      .interactive-chart {position:relative;min-width:0;background:white;}
      .plot-toolbar {display:flex;align-items:center;justify-content:space-between;gap:8px;height:27px;margin:0 2px;}
      .plot-count {color:#939aa2;font-size:10px;letter-spacing:.015em;}
      .plot-actions {display:flex;align-items:center;gap:2px;}
      .plot-actions button,.plot-settings-title button {display:grid;place-items:center;width:27px;height:27px;padding:5px;border:0;background:transparent;color:#929aa3;border-radius:5px;cursor:pointer;}
      .plot-actions button:hover,.plot-actions button[aria-expanded=true] {background:#f0f2f4;color:#303b46;}
      .plot-actions svg,.plot-settings-title svg {width:16px;height:16px;}
      .plot-canvas {width:100%;height:285px;}
      .plot-legend {display:flex;gap:6px;flex-wrap:wrap;margin:0 3px;min-height:34px;align-items:center;}
      .plot-series {display:flex;align-items:center;gap:7px;border:0;background:#f7f8f9;border-radius:5px;font-size:10px;padding:6px 8px;color:#69717c;max-width:100%;cursor:pointer;}
      .plot-series span:nth-child(2) {max-width:210px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
      .plot-series b {font-variant-numeric:tabular-nums;color:#29343e;font-size:11px;}
      .plot-swatch {width:6px;height:6px;border-radius:50%;flex:none;}
      .plot-series.is-muted {opacity:.3;}
      .plot-settings {position:absolute;right:0;top:32px;z-index:30;width:250px;padding:14px;background:white;border:1px solid #e0e4e7;border-radius:8px;box-shadow:0 8px 30px #18233120;font-size:12px;}
      .plot-settings[hidden],.plot-tooltip[hidden] {display:none;}
      .plot-settings-title {display:flex;align-items:center;justify-content:space-between;font-weight:600;margin-bottom:8px;color:#303b46;}
      .plot-settings label {display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;color:#626d77;}
      .plot-settings select {font-size:12px;padding:5px 8px;width:130px;border:1px solid #e0e4e7;border-radius:5px;color:#374151;}
      .plot-settings .plot-smoothing {flex-wrap:wrap;}
      .plot-settings input[type=range] {width:100%;padding:0;accent-color:#ab4e34;}
      .plot-settings small {color:#929aa3;font-size:10px;line-height:1.5;display:block;}
      .plot-tooltip {position:absolute;top:70px;right:30px;z-index:20;min-width:210px;max-width:85%;background:#fff;border:1px solid #dfe4e9;border-radius:7px;box-shadow:0 8px 25px #24324825;pointer-events:none;font-size:11px;overflow:hidden;}
      .plot-tooltip-head {display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f6f8fa;border-bottom:1px solid #e9edf0;font-size:9px;color:#7b8794;letter-spacing:.07em;}
      .plot-tooltip-head b {color:#303b46;font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;}
      .plot-tooltip-head span {margin-left:auto;}
      .plot-tooltip-row {display:flex;gap:9px;align-items:center;padding:8px 12px;}
      .plot-tooltip-row i {width:3px;height:14px;flex:none;}

            await TrackCharts.render($('#compare-charts'),old);$('#compare-table').innerHTML=table();
            if(rs.some(r=>['queued','running','stopping'].includes(r.state)))timer=setTimeout(refresh,5000);
          }catch(e){if(token===generation){error(e);timer=setTimeout(refresh,10000);}}
        }
        if(rs.some(r=>['queued','running','stopping'].includes(r.state)))timer=setTimeout(refresh,5000);
      }
      function fastLadderResults(e) {
        if(e.protocol!=='fast-en-v1')return '';
        const pct=value=>Number.isFinite(value)?(100*value).toFixed(1)+'%':'—';
        const names={fast_lm:'Held-out LM · 40%',fast_blimp:'BLiMP-fast · 35%',fast_supplement:'BLiMP Supplement · 10%',fast_ewok:'EWoK-fast · 5%',fast_arc:'ARC-Easy · 10%'};
        return `<section class="panel" style="padding:16px;margin:12px 0"><b>${e.mode==='smoke'?'Smoke ':''}FastScore EN: ${pct(e.fast_score)}</b><small> · Experimental internal score · ${esc(e.protocol)}</small><table><thead><tr><th>Component</th><th>Measurements</th><th>Items / bytes</th></tr></thead><tbody>${Object.entries(names).map(([key,name])=>{const v=e.results[key]||{};return `<tr><td>${name}</td><td>${key==='fast_ewok'&&!v.samples?'HF access required':v.error?esc(v.error):key==='fast_lm'?`BPB ${fmt(v.bpb,4)} · NLL ${fmt(v.nll,4)}`:`Accuracy ${pct(v.accuracy)} · margin ${fmt(v.mean_margin_nats,4)} nats${v.mean_correct_probability!=null?` · P(correct) ${pct(v.mean_correct_probability)}`:''}`}</td><td>${v.samples??'—'}</td></tr>`;}).join('')}</tbody></table><small>Fixed English diagnostics. Not comparable with TinyScore. Smoke checks execution only. External held-out split; training overlap has not been audited.</small></section>`;
      }
      async function benchmarkDashboard(){
        const token=generation;
        const [catalog,projects]=await Promise.all([api('/benchmarks/catalog'),api('/projects')]);
        const runs=(await Promise.all(projects.map(p=>api('/projects/'+encodeURIComponent(p.name)+'/runs')))).flat().filter(r=>r.state==='finished'&&r.metadata.engine==='tiny-transformer');
        if(token!==generation)return;
        app.innerHTML=`<div class="compare-heading"><div><div class="eyebrow">Evaluation studio</div><h1>Benchmarks</h1><p class="muted">Run missing tasks. Keep completed results. Compare measured results. <a href="/benchmark-results">Browse published checkpoint results →</a></p></div><a class="secondary" href="/runs">My runs →</a></div>${metricHelp()}<details class="panel benchmark-guide"><summary><b>Benchmark guide · English fast ladder</b></summary><table><thead><tr><th>Component</th><th>Full-suite size</th><th>Metric</th><th>Weight</th></tr></thead><tbody><tr><td>Held-out LM</td><td>~1M UTF-8 byte tokens</td><td>NLL / BPB</td><td>40%</td></tr><tr><td>BLiMP-fast</td><td>8,509 pairs</td><td>Logprob margin + accuracy</td><td>35%</td></tr><tr><td>BLiMP Supplement</td><td>5,218 pairs</td><td>Margin + accuracy</td><td>10%</td></tr><tr><td>EWoK-fast</td><td>1,500 items · HF access pending</td><td>Preference margin</td><td>5%</td></tr><tr><td>ARC-Easy</td><td>1,000 items</td><td>MC logprob</td><td>10%</td></tr></tbody></table><p class="muted">Four components are ready. EWoK requires approved Hugging Face access; the combined FastScore remains unavailable until all five have results. BLiMP uses the BabyLM 2024 vocabulary-filtered data. Smoke runs use 10 items per component and 8,192 LM bytes.</p><details><summary>Experimental FastScore normalization</summary><p>LM: 1 − BPB / 8. Pair diagnostics: mean tanh of the logprob margin per maximum candidate byte length, in bits. ARC-Easy: mean (P(correct) − 1/K) / (1 − 1/K). Apply the weights above only when all components are present. These are internal diagnostics, not official benchmark scores; raw metrics remain visible.</p></details></details><section class="panel" style="padding:16px"><form id="global-benchmark-form"><div class="fields"><label class="field"><span>Saved model</span><select name="run_id" required>${runs.length?runs.map(r=>`<option value="${r.id}">${esc(r.name)} · ${esc(r.config.model_size||'model')}</option>`).join(''):'<option value="">No finished models yet</option>'}</select></label><label class="field"><span>Suite</span><select name="suite"><option value="fast">Fast ladder EN · 4 ready / EWoK pending</option><option value="fast_pl">Fast ladder PL · Polish BPB + agreement + induction</option><option value="tinylm">TinyLM · 6 tasks</option><option value="piqa">PIQA only · English physical commonsense</option><option value="core">Core · 5 tasks</option><option value="extended">Extended · 8 tasks</option></select></label><label class="field"><span>Evaluation size</span><select name="mode"><option value="smoke">Smoke · 10 examples per subtask</option><option value="full">Full suite · fixed sample for Fast ladder</option></select></label></div><button class="primary" ${!runs.length||!catalog.available?'disabled':''}>Run missing benchmarks</button><small class="muted" style="margin-left:12px">FIFO · up to 20 waiting · one active evaluation per worker</small></form></section><section id="benchmark-dashboard-queue" style="margin:22px 0"></section><section id="benchmark-history"></section><div class="actions"><button class="secondary" id="eval-prev">← Previous</button><small id="eval-page"></small><button class="secondary" id="eval-next">Next →</button></div>`;
        let offset=0, scoreOrder=null, refreshVersion=0;
        const expandedEvaluations=new Set();
        async function evaluationPage(pageOffset,order){
          if(!order) return api('/benchmarks/evaluations?limit=20&offset='+pageOffset);
          const all=await api('/benchmarks/evaluations?limit=100&offset=0');
          for(let start=100;start<all.total;start+=100){
            const page=await api('/benchmarks/evaluations?limit=100&offset='+start);
            all.items.push(...page.items);
          }
          all.items.sort((a,b)=>{
            const av=Number.isFinite(a.tiny_score),bv=Number.isFinite(b.tiny_score);
            if(av!==bv) return av?-1:1;
            return av ? (order==='desc'?-1:1)*(a.tiny_score-b.tiny_score) : 0;
          });
          return {...all,items:all.items.slice(pageOffset,pageOffset+20)};
        }
        async function refresh(){
          const version=++refreshVersion;
          clearTimeout(benchmarkTimer);
          const [q,h]=await Promise.all([api('/benchmarks/queue'),evaluationPage(offset,scoreOrder)]);if(token!==generation||version!==refreshVersion)return;
          $('#benchmark-dashboard-queue').innerHTML=`<div class="row"><h2 style="font-size:23px">Queue</h2><small>${q.running} running · ${q.waiting} waiting</small></div>${q.items.length?`<div class="panel benchmark-queue" style="padding:6px 14px">${q.items.map(e=>`<div class="legend"><div><a href="/run/${e.run_id}">${esc(e.run_name)}</a><small style="display:block">${e.mode} · ${e.tasks.length} tasks</small></div><span>${e.status==='queued'?'Queue #'+e.queue_position:esc(e.current_task||'Starting worker')} · ${Object.keys(e.results).length}/${e.tasks.length} <button class="secondary" style="padding:6px 10px;margin-left:10px" data-eval-cancel="${e.id}" data-eval-run="${e.run_id}">Cancel</button></span></div>`).join('')}</div>`:'<div class="panel" style="padding:20px"><small>No pending evaluations for your models.</small></div>'}`;
          const pct=v=>Number.isFinite(v)?(v*100).toFixed(1)+'%':'—';
          $('#benchmark-history').innerHTML=`<h2 style="font-size:23px">Evaluation history</h2><div class="comparison-table"><table class="benchmark-history-table"><thead><tr><th>Model</th><th>Status</th><th>Mode</th><th aria-sort="${scoreOrder==='desc'?'descending':scoreOrder==='asc'?'ascending':'none'}"><button class="secondary" id="tiny-score-sort" style="padding:3px 6px;white-space:nowrap" title="Sort all evaluations by TinyScore">TinyScore ${scoreOrder==='desc'?'↓':scoreOrder==='asc'?'↑':'↕'}</button></th>${catalog.core.map(k=>`<th class="metric-column">${esc(catalog.tasks.find(t=>t.id===k)?.name||k)}</th>`).join('')}<th>Started</th><th>Details</th></tr></thead><tbody>${h.items.map(e=>`<tr><td><a class="benchmark-model-link" href="/run/${e.run_id}" title="${esc(e.run_name)}">${esc(e.run_name)}</a></td><td>${esc(e.status)}${e.queue_position?' #'+e.queue_position:''}</td><td>${esc(e.mode)}</td><td><b>${pct(e.tiny_score)}</b></td>${catalog.core.map(k=>`<td>${pct(e.results[k]?.accuracy)}</td>`).join('')}<td title="${esc(new Date(e.created_at).toLocaleString())}">${new Date(e.created_at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td><button class="secondary eval-details-toggle" data-eval-details="${e.id}" aria-expanded="${expandedEvaluations.has(e.id)}" aria-controls="eval-details-${e.id}">${expandedEvaluations.has(e.id)?'Hide':'Details'}</button></td></tr><tr class="benchmark-details" id="eval-details-${e.id}" ${expandedEvaluations.has(e.id)?'':'hidden'}><td colspan="${catalog.core.length+6}">${fastLadderResults(e)||`<p>${esc(e.protocol||'')} · ${Object.keys(e.results).length}/${e.tasks?.length||0} tasks</p><table><thead><tr><th>Task</th><th>Accuracy</th><th>Samples</th></tr></thead><tbody>${Object.entries(e.results).map(([k,v])=>`<tr><td>${esc(catalog.tasks.find(t=>t.id===k)?.name||k)}</td><td>${v.error?esc(v.error):pct(v.accuracy)}</td><td>${v.samples??'—'}</td></tr>`).join('')}</tbody></table>`}${e.error?`<p role="alert">${esc(e.error)}</p>`:''}</td></tr>`).join('')||`<tr><td colspan="${catalog.core.length+6}">No measurements yet. Add a saved model to the queue above.</td></tr>`}</tbody></table></div><p class="muted" style="font-size:11px">Task columns show accuracy. TinyScore averages chance-normalized scores across the five core tasks. Smoke results use small samples; compare full evaluations for quality.</p>`;
          document.querySelectorAll('[data-eval-details]').forEach(b=>b.onclick=()=>{
            const id=b.dataset.evalDetails,open=!expandedEvaluations.has(id);
            if(open)expandedEvaluations.add(id);else expandedEvaluations.delete(id);
            $('#eval-details-'+id).hidden=!open;b.setAttribute('aria-expanded',String(open));b.textContent=open?'Hide':'Details';
          });
          $('#tiny-score-sort').onclick=()=>{scoreOrder=scoreOrder==='desc'?'asc':'desc';offset=0;refresh().catch(error);};
          $('#eval-prev').disabled=offset===0;$('#eval-next').disabled=offset+20>=h.total;$('#eval-page').textContent=h.total?`${offset+1}–${Math.min(offset+20,h.total)} of ${h.total}`:'0 evaluations';
          document.querySelectorAll('[data-eval-cancel]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await post('/runs/'+b.dataset.evalRun+'/benchmarks/'+b.dataset.evalCancel+'/cancel',{});await refresh();}catch(e){error(e);b.disabled=false;}});
          benchmarkTimer=setTimeout(()=>refresh().catch(error),5000);
        }
        $('#global-benchmark-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{await post('/runs/'+f.elements.run_id.value+'/benchmarks',{suite:f.elements.suite.value,mode:f.elements.mode.value});toast('Evaluation added to the queue.');offset=0;await refresh();}catch(e){error(e);}finally{b.disabled=false;}};
        $('#eval-prev').onclick=()=>{offset=Math.max(0,offset-20);refresh().catch(error);};$('#eval-next').onclick=()=>{offset+=20;refresh().catch(error);};
        await refresh();
      }
      let leaderboardRevision = 0;
      function leaderFamily(name) { return name.replace(/-seed\d+$/i, ""); }
      function renderLeaderScatter(id, rows) {
        const el = document.getElementById(id);
        if (!el) return;
        const pts = rows.filter(r => Number.isFinite(r.val_loss) && Number.isFinite(r.perplexity));
        if (!pts.length) { el.innerHTML = '<p class="muted" style="margin:0">No numeric scores yet.</p>'; return; }
        const palette = TrackCharts.palette;
        const families = [...new Set(pts.map(r => leaderFamily(r.name)))];
        const traces = families.map((fam, i) => {
          const subset = pts.filter(r => leaderFamily(r.name) === fam);
          return { type: "scatter", mode: "markers", name: fam,
            x: subset.map(r => r.val_loss), y: subset.map(r => r.perplexity),
            text: subset.map(r => `${esc(r.name)} · ${esc(r.owner)}<br>${fmt(r.throughput, 0)} byte tokens/s · ${r.steps} steps`),
            hovertemplate: "%{text}<br>loss %{x:.4f} · perplexity %{y:.3f}<extra></extra>",
            marker: { size: 9, color: palette[i % palette.length] } };
        });
        Plotly.newPlot(el, traces, { margin: {l:52,r:16,t:8,b:40}, height: 300,
          paper_bgcolor: "#f8f9f5", plot_bgcolor: "#f8f9f5", font: {family:"monospace",size:11,color:"#647368"},
          xaxis: { title: {text:"Validation loss",font:{size:10}}, gridcolor:"#edf0f2", zeroline:false },
          yaxis: { title: {text:"Perplexity",font:{size:10}}, gridcolor:"#edf0f2", zeroline:false },
          legend: { orientation:"h", y:-0.28, font:{size:10} } },
          { responsive:true, displaylogo:false, displayModeBar:false });
      }
      async function leaderboard(token = generation) {
        const revision = ++leaderboardRevision;
        const sort = document.querySelector("#leader-sort")?.value || "val_loss";
        const data = await api("/leaderboard?sort=" + sort + "&order=" + (sort === "throughput" ? "desc" : "asc"));
        if (token !== generation || revision !== leaderboardRevision) return;
        const sizes = data.sizes || [];
        const allModels = sizes.flatMap(s => s.models);
        const sizeTable = (size) => `<h2 style="font-size:20px;margin:28px 0 10px">${esc((size.model_size||"unknown").toUpperCase())} · ${size.parameters ? size.parameters.toLocaleString() + " parameters" : "unknown size"}</h2><div class="panel table-scroll"><table><thead><tr><th>#</th><th>Model</th><th>Author</th><th>Validation loss</th><th>Perplexity</th><th>Last train loss</th><th>Tokens / sec</th><th>Auto benchmark</th><th>Recipe</th></tr></thead><tbody>${size.models.map((r) => `<tr><td><strong>${r.rank}</strong></td><td><a href="/run/${r.id}">${esc(r.name)}</a><br><small>${new Date(r.started_at).toLocaleString()} · ${r.steps} steps</small></td><td>${esc(r.owner)}</td><td><strong>${fmt(r.val_loss)}</strong></td><td>${fmt(r.perplexity)}</td><td>${fmt(r.train_loss)}</td><td>${fmt(r.throughput, 0)}</td><td>${r.auto_benchmark ? (r.auto_benchmark.score!=null ? esc(r.auto_benchmark.label)+' · '+(r.auto_benchmark.is_percent ? fmt(r.auto_benchmark.score*100,1)+'%' : fmt(r.auto_benchmark.score,2)) : (r.auto_benchmark.state==="queued"||r.auto_benchmark.state==="running" ? '<span class="muted">running…</span>' : (r.auto_benchmark.state==="failed" ? '<span class="muted">failed</span>' : '—'))) : '—'}</td><td>${r.mix.map((d) => `${esc(d.name)} ${d.weight}%`).join("<br>")}</td></tr>`).join("")}</tbody></table></div><div class="panel" style="padding:14px 18px;margin-top:10px"><strong style="font-size:13px">Validation loss vs perplexity</strong><div id="${"leader-scatter-" + size.model_size}" style="margin-top:8px"></div></div>`;
        app.innerHTML = `<div class="intro row"><div><div class="eyebrow">Model leaderboard</div><h1>Measured progress, side by side.</h1><p class="muted">Published scores ranked by saved-checkpoint validation, grouped by model size — sizes aren't comparable on raw loss. Open a model to try a text continuation after signing in. Create an account to train and publish your own results.</p></div><a class="primary" href="/new">+ New training run</a></div><div class="row" style="margin-bottom:20px"><label class="field" style="margin:0;max-width:240px"><span>Rank by</span><select id="leader-sort"><option value="val_loss" ${sort === "val_loss" ? "selected" : ""}>Lowest validation loss</option><option value="perplexity" ${sort === "perplexity" ? "selected" : ""}>Lowest perplexity</option><option value="throughput" ${sort === "throughput" ? "selected" : ""}>Highest throughput</option><option value="started_at" ${sort === "started_at" ? "selected" : ""}>Newest run</option></select></label><small class="muted">Lower loss and perplexity are better on the same evaluation data.</small></div>${metricHelp()}${sizes.length ? sizes.map(sizeTable).join("") : `<div class="panel empty"><h2>No completed models yet.</h2><p class="muted">Finish a training run and its measured validation metrics will appear here.</p><a class="primary" href="/new">Start your first run →</a></div>`}<p class="muted" style="font-size:12px;margin-top:18px">This is a smoke-test leaderboard. Scores are comparable when runs use the same model size, validation data and settings.</p>`;
        $("#leader-sort").onchange = () => leaderboard().catch(error);
        for (const size of sizes) renderLeaderScatter("leader-scatter-" + size.model_size, size.models);
        const compareBox=document.createElement("section"); compareBox.className="panel"; compareBox.style.cssText="padding:14px 18px;margin:0 0 18px";
        compareBox.innerHTML=`<div class="row"><strong>Compare validation perplexity</strong><button class="secondary" id="leader-compare" disabled>Compare selected runs</button></div><small class="muted">Select two or more finished runs to draw their validation perplexity on one synchronized chart.</small><div class="row" style="margin-top:10px;gap:14px;flex-wrap:wrap">${allModels.map(r=>`<label><input type="checkbox" data-leader-run="${r.id}"> ${esc(r.name)}</label>`).join("")}</div>`;
        app.querySelector(".intro").after(compareBox);
        const selectedLeader=new Set(); document.querySelectorAll("[data-leader-run]").forEach(input=>input.onchange=()=>{if(input.checked)selectedLeader.add(input.dataset.leaderRun);else selectedLeader.delete(input.dataset.leaderRun);const b=$("#leader-compare");b.disabled=selectedLeader.size<2;b.textContent=selectedLeader.size<2?"Compare selected runs":`Compare ${selectedLeader.size} runs`;});
        $("#leader-compare").onclick=()=>{location.assign("/" + ("compare/"+[...selectedLeader].join(",")+"?metric=val%2Fperplexity"));};
      }
      async function route() {
        navigationController.abort();
        navigationController = new AbortController();
        $('#dataset-preview')?.close();
        TrackCharts.dispose(app);
        app.classList.remove("run-view", "compare-view");
        clearTimeout(timer);
        clearTimeout(benchmarkTimer);
        const token = ++generation,
          hash = (location.pathname.replace(/^\/|\/$/g, "") || "new");
        $("#nav-new").classList.toggle("active", hash === "new");
        $("#nav-runs").classList.toggle("active", hash === "runs" || hash.startsWith("run/") || hash.startsWith("compare/"));
        $("#nav-benchmarks").classList.toggle("active", hash === "benchmarks");
        $("#nav-leaderboard").classList.toggle("active", hash === "leaderboard");
        $("#nav-guide").classList.toggle("active", hash === "guide");
        app.innerHTML = '<p class="muted" role="status">Loading workspace…</p>';
        try {
          if (hash === "guide") { await trainingGuide(); return; }
          if (["login", "register"].includes(hash)) { authForm(hash === "register"); return; }
          if (!account && hash !== "leaderboard" && !hash.startsWith("run/")) { authNext = hash; authForm(); return; }
          if (hash === "account") { await accountPage(); return; }
          if (hash.startsWith("run/")) await detail(hash.slice(4), token);
          else if (hash.startsWith("compare/")) {
            const [rawIds,query] = (hash.slice(8) + location.search).split("?");
            const params=new URLSearchParams(query||"");
            await compare(rawIds.split(","), params.get("metric"));
          }
          else if (hash === "runs") await runs();
          else if (hash === "benchmarks") await benchmarkDashboard();
          else if (hash === "leaderboard") await leaderboard();
          else {
            stage = 1;
            await studio();
          }
        } catch (e) {
          if (token !== generation || e.name === "AbortError") return;
          error(e);
          const b = document.createElement("button");
          b.className = "secondary";
          b.textContent = "Try again";
          b.onclick = route;
          app.append(b);
        }
      }
      let authReady = false;
      // Old bookmarks receive one full navigation to their canonical page.
      function redirectLegacyBookmark() {
        const legacy = location.hash.slice(1);
        if (/^(new|runs|benchmarks|leaderboard|guide|login|register|account|run\/[a-zA-Z0-9-]+|compare\/[a-zA-Z0-9,-]+)(\?.*)?$/.test(legacy)) {
          location.replace('/' + legacy);
          return true;
        }
        return false;
      }
      (async () => {
        if (redirectLegacyBookmark()) return;
        try { account = (await api("/auth/me")).user; restoreDraft(); accountNav(); authReady=true; await route(); }
        catch(e) { error(e); }
      })();
    </script>
  </body>
