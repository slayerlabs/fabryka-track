<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Training studio · Fabryka Track</title>
    <style>
      :root {
        --bg: #f5f3ed;
        --paper: #fffefa;
        --ink: #292b25;
        --muted: #74766c;
        --line: #dedfd5;
        --accent: #a84d33;
        --green: #527660;
        --blue: #647d96;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 4px;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      a {
        color: inherit;
      }
      header {
        height: 82px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5vw;
        background: var(--paper);
      }
      .brand {
        font-weight: 750;
        letter-spacing: -0.6px;
        text-decoration: none;
        font-size: 19px;
      }
      .brand span {
        color: var(--accent);
        margin-right: 10px;
      }
      nav {
        display: flex;
        gap: 25px;
      }
      nav a {
        text-decoration: none;
        color: var(--muted);
        padding: 29px 0;
      }
      nav a.active {
        color: var(--ink);
        border-bottom: 2px solid var(--accent);
      }
      main {
        max-width: 1160px;
        padding: 45px 30px 60px;
        margin: auto;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font:
          normal clamp(32px, 4vw, 45px) Georgia,
          serif;
        letter-spacing: -1.5px;
        margin-bottom: 12px;
      }
      h2 {
        font:
          normal 26px Georgia,
          serif;
        letter-spacing: -0.5px;
      }
      h3 {
        font-size: 16px;
      }
      p {
        line-height: 1.6;
      }
      .muted,
      small {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 15px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .intro {
        margin-bottom: 32px;
      }
      .steps {
        display: flex;
        border-bottom: 1px solid var(--line);
        margin-bottom: 30px;
        gap: 36px;
      }
      .step {
        padding: 0 0 18px;
        color: var(--muted);
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
      }
      .step.active {
        color: var(--accent);
        border-color: var(--accent);
      }
      .step b {
        display: inline-grid;
        place-items: center;
        width: 25px;
        height: 25px;
        border: 1px solid var(--line);
        border-radius: 50%;
        margin-right: 9px;
        font-size: 12px;
      }
      .step.active b {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 24px;
        align-items: start;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 26px;
      }
      .panel + .panel {
        margin-top: 18px;
      }
      .aside {
        position: sticky;
        top: 24px;
      }
      .dataset {
        padding: 23px 0;
        border-top: 1px solid var(--line);
      }
      .dataset:first-child {
        border: 0;
      }
      .dataset h3 {
        margin: 0 0 5px;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 9px;
      }
      .dataset input[type="range"] {
        width: 100%;
        margin: 19px 0 5px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .percent {
        font-size: 24px;
        font-variant-numeric: tabular-nums;
      }
      .stack {
        display: flex;
        overflow: hidden;
        height: 12px;
        background: var(--line);
        border-radius: 5px;
        margin: 20px 0;
      }
      .stack span {
        transition: width 0.15s;
      }
      .legend {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        font-size: 13px;
        gap: 10px;
      }
      .divider {
        border-top: 1px solid var(--line);
        margin: 20px 0;
      }
      .primary,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border-radius: 7px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      .primary {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: white;
      }
      .secondary {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .wide {
        width: 100%;
      }
      .upload {
        padding: 18px;
        border: 1px dashed #b7b9ae;
        border-radius: 8px;
        margin-top: 12px;
        display: flex;
        gap: 15px;
        align-items: center;
        justify-content: space-between;
      }
      .upload p {
        font-size: 13px;
        margin: 3px 0;
      }
      .field {
        display: block;
        margin-bottom: 23px;
      }
      .field > span {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 9px;
      }
      input:not([type="range"]):not([type="checkbox"]),
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cfd1c5;
        border-radius: 6px;
        background: white;
        color: var(--ink);
      }
      .field small {
        display: block;
        line-height: 1.5;
        margin-top: 7px;
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .choice {
        padding: 20px;
        border: 1px solid var(--green);
        background: #f3f6ef;
        border-radius: 8px;
        margin-bottom: 25px;
      }
      .choice h3 {
        margin: 0 0 7px;
      }
      .choice p {
        font-size: 13px;
        margin: 0;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        display: inline-block;
        padding: 5px 8px;
        border-radius: 4px;
        background: #eceee6;
        color: var(--green);
        white-space: nowrap;
      }
      .badge.failed,
      .badge.interrupted {
        color: #a13e30;
        background: #f8e4df;
      }
      .badge.running {
        background: #e3efdf;
      }
      .badge.queued,
      .badge.stopping {
        color: #866426;
        background: #f5eddc;
      }
      .notice {
        background: #eeeee5;
        padding: 13px 16px;
        border-radius: 7px;
        color: #656856;
        font-size: 13px;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 28px;
      }
      .error {
        color: #9c352a;
        background: #fbeae5;
        border: 1px solid #e9c0b8;
        padding: 14px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin: 24px 0;
      }
      .metric {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 20px;
      }
      .metric small {
        display: block;
        margin-bottom: 10px;
      }
      .metric strong {
        font-size: 26px;
        font-weight: 500;
        letter-spacing: -0.6px;
      }
      .charts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .chart {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 22px;
        min-width: 0;
      }
      .chart h3 {
        margin: 0 0 16px;
      }
      .chart svg {
        width: 100%;
        height: auto;
      }
      .empty {
        text-align: center;
        padding: 55px 20px;
      }
      .empty h2 {
        margin-bottom: 10px;
      }
      .run-list {
        display: grid;
        gap: 12px;
      }
      .run-item {
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 20px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .run-item > a {
        flex: 1;
        text-decoration: none;
      }
      .run-item h3 {
        margin: 0 0 6px;
      }
      .run-item input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        line-height: 1.7;
        max-height: 230px;
        overflow: auto;
        margin: 0;
      }
      details {
        margin-top: 22px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 17px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding: 22px 5vw;
        font-size: 12px;
        color: var(--muted);
      }
      .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        padding: 12px 22px;
        border-radius: 8px;
        z-index: 5;
      }
      .table-scroll {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      td,
      th {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      progress {
        width: 100%;
        height: 8px;
        accent-color: var(--green);
      }
      @media (max-width: 760px) {
        header {
          height: 65px;
          padding: 0 20px;
        }
        .brand {
          font-size: 16px;
        }
        nav {
          gap: 16px;
        }
        nav a {
          padding: 21px 0;
          font-size: 13px;
        }
        main {
          padding: 28px 18px;
        }
        .layout,
        .charts {
          grid-template-columns: 1fr;
        }
        .aside {
          position: static;
        }
        .metrics {
          grid-template-columns: 1fr 1fr;
        }
        .steps {
          gap: 14px;
        }
        .step {
          font-size: 12px;
        }
        .step b {
          margin-right: 4px;
        }
        .panel {
          padding: 20px;
        }
        .intro.row {
          align-items: start;
          flex-wrap: wrap;
        }
        .run-item {
          gap: 10px;
        }
        .run-item .loss-label {
          display: none;
        }
        .fields {
          grid-template-columns: 1fr;
        }
        .upload {
          flex-wrap: wrap;
        }
        footer {
          gap: 20px;
        }
        .percent {
          font-size: 21px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="#new"><span>✳</span>fabryka / track</a>
      <nav aria-label="Main">
        <a href="#new" id="nav-new">Training studio</a
        ><a href="#runs" id="nav-runs">My runs</a
        ><a href="#leaderboard" id="nav-leaderboard">Leaderboard</a><a href="#login" id="nav-account">Sign in</a>
      </nav>
    </header>
    <main id="app"></main>
    <footer>
      <span>Small experiments. Clear results.</span
      ><span>Fabryka Track · Local training</span>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        app = $("#app");
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const colors = ["#a84d33", "#527660", "#647d96", "#b49953", "#967c98"];
      const fmt = (n, d = 2) =>
        Number.isFinite(n)
          ? n.toLocaleString(undefined, { maximumFractionDigits: d })
          : "—";
      let account = null, authNext = "leaderboard";
      async function api(path, opt = {}) {
        const r = await fetch("/api" + path, {...opt, headers: {"X-Track-Request": "1", ...opt.headers}});
        if (!r.ok) {
          let b;
          try {
            b = await r.json();
          } catch {}
          throw Error(
            typeof b?.detail === "string"
              ? b.detail
              : Array.isArray(b?.detail)
                ? b.detail.map((x) => x.msg).join(" ")
                : "Could not connect. Please try again.",
          );
        }
        return r.json();
      }
      const post = (path, body) =>
        api(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      function toast(message) {
        const t = $("#toast");
        t.className = "toast";
        t.textContent = message;
        setTimeout(() => {
          t.textContent = "";
          t.className = "";
        }, 3500);
      }
      function error(e) {
        let box = $("#error");
        if (!box) {
          box = document.createElement("div");
          box.id = "error";
          box.className = "error";
          box.setAttribute("role", "alert");
          app.prepend(box);
        }
        box.textContent = e.message;
      }
      let datasets = [],
        draft = {
          weights: {},
          name: "New training run",
          steps: 100,
          batch_size: 8,
          learning_rate: 0.003,
          seed: 42,
          model_size: "tiny",
          budget_mode: "manual",
          target_tokens: 100000000,
        },
        stage = 1,
        timer,
        generation = 0,
        selected = new Set();
      const initialDraft = structuredClone(draft);
      function draftKey() { return "training-draft-v3:" + (account?.id || "guest"); }
      function restoreDraft() {
        draft = structuredClone(initialDraft);
        try { Object.assign(draft, JSON.parse(localStorage.getItem(draftKey()) || "{}")); } catch {}
        if (!String(draft.name || "").trim()) draft.name = "New training run";
        datasets = []; selected.clear(); stage = 1;
      }
      function save() {
        if (!account) return;
        try { localStorage.setItem(draftKey(), JSON.stringify(draft)); } catch {}
      }
      function accountNav() {
        $("#nav-account").textContent = account ? account.username : "Sign in";
        $("#nav-account").href = account ? "#account" : "#login";
      }
      function authForm(register = false) {
        app.innerHTML = `<section class="panel" style="max-width:480px;margin:35px auto"><div class="eyebrow">Your workspace</div><h1>${register ? "Create an account" : "Welcome back"}</h1><p class="muted">Keep datasets and training runs private. Publish selected scores to the leaderboard.</p><button class="secondary" id="hf-signin" style="width:100%;margin:12px 0">🤗 Sign in with Hugging Face</button><p class="muted">Or use your Track username and password.</p><form id="auth-form"><label class="field"><span>Username</span><input name="username" autocomplete="username" pattern="[A-Za-z0-9_-]{3,32}" minlength="3" maxlength="32" required><small>3–32 letters, numbers, underscores or hyphens.</small></label><label class="field"><span>Password</span><input name="password" type="password" autocomplete="${register ? "new-password" : "current-password"}" minlength="12" maxlength="128" required><small>At least 12 characters. Keep it in your password manager; email recovery is not available.</small></label><button class="primary" type="submit">${register ? "Create account" : "Sign in"}</button></form><p style="margin-top:20px"><a href="${register ? "#login" : "#register"}">${register ? "Already have an account? Sign in" : "Create an account"}</a></p><a href="#leaderboard">Browse the public leaderboard →</a></section>`;
        $("#hf-signin").onclick = () => startHuggingFace(false);
        $("#auth-form").onsubmit = async event => {
          event.preventDefault();
          const form = event.currentTarget, button = form.querySelector("button"); button.disabled = true;
          try {
            const result = await post(register ? "/auth/register" : "/auth/login", {username: form.elements.username.value, password: form.elements.password.value});
            account = result.user; restoreDraft(); accountNav();
            if (location.hash === "#" + authNext) await route(); else location.hash = authNext;
          } catch (e) { error(e); button.disabled = false; }
        };
      }
      async function startHuggingFace(link) {
        const button = $(link ? "#hf-connect" : "#hf-signin");
        if (button) button.disabled = true;
        try { const result = await post("/auth/huggingface/start", {link}); location.assign(result.url); }
        catch(e) { error(e); if (button) button.disabled = false; }
      }
      async function accountPage() {
        account = (await api("/auth/me")).user;
        if (!account) { authForm(); return; }
        app.innerHTML = `<section class="panel" style="max-width:600px;margin:30px auto"><div class="eyebrow">Account</div><h1>${esc(account.username)}</h1><p>Your datasets, notes and model files are private. Publishing shares your username, run name, scores and mixture percentages, while uploaded filenames and contents stay private.</p><div class="actions"><a class="primary" href="#new">New training run →</a><button class="secondary" id="logout">Sign out</button></div><div class="divider"></div><h2>Hugging Face</h2>${account.huggingface_username ? `<p>Connected as <b>${esc(account.huggingface_username)}</b>.</p>` : `<p class="muted">Connect your HF account to sign in to this same workspace.</p><button class="secondary" id="hf-connect">🤗 Connect Hugging Face</button>`}<div class="divider"></div><h2>${account.has_password ? "Change password" : "Set a Track password"}</h2><form id="password-form"><label class="field"><span>Current password</span><input name="current_password" type="password" autocomplete="current-password" maxlength="128" required></label><label class="field"><span>New password</span><input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p class="muted">Changing your password signs out other sessions and revokes your API key.</p><button class="primary">Update password</button></form><div class="divider"></div><h2>SDK API key</h2><p class="muted">Use an API key with the Python tracker. Generating a key replaces the previous one.</p><form id="key-form"><label class="field"><span>Confirm password</span><input name="password" type="password" autocomplete="current-password" maxlength="128" required></label><button class="secondary">Generate API key</button><button type="button" class="secondary" id="revoke-key">Revoke API key</button></form><div id="key-result"></div></section>`;
        if ($("#hf-connect")) $("#hf-connect").onclick = () => startHuggingFace(true);
        if (!account.has_password) {
          for (const selector of ['#password-form [name=current_password]', '#key-form [name=password]']) {
            const input = $(selector); input.required = false; input.closest("label").hidden = true;
          }
          $("#password-form").insertAdjacentHTML("afterbegin", '<p class="muted">You can keep signing in with HF. Set a password only if you also want a Track login. Credential changes require a Hugging Face sign-in within the last 5 minutes.</p>');
        }
        $("#logout").onclick = async () => { try { await post("/auth/logout", {}); account = null; restoreDraft(); accountNav(); location.hash = "leaderboard"; } catch(e) { error(e); } };
        $("#password-form").onsubmit = async event => {
          event.preventDefault(); const f = event.currentTarget; const b=f.querySelector("button"); b.disabled=true;
          try { await post("/auth/password", {current_password:f.elements.current_password.value,new_password:f.elements.new_password.value}); f.reset(); await accountPage(); toast("Password updated. Other sessions and API keys revoked."); } catch(e) { error(e); } finally { b.disabled=false; }
        };
        $("#key-form").onsubmit = async event => {
          event.preventDefault(); const f=event.currentTarget; const b=f.querySelector("button"); b.disabled=true;
          try { const result=await post("/auth/api-key", {password:f.elements.password.value}); f.reset(); $("#key-result").innerHTML=`<p>Copy this key now. It is shown only once.</p><label class="field"><span>API key</span><input readonly value="${esc(result.api_key)}"></label><p class="muted">Set FABRYKA_API_KEY and FABRYKA_API_URL=https://track.fabryka.ai in your training environment.</p>`; } catch(e) { error(e); } finally { b.disabled=false; }
        };
        $("#revoke-key").onclick = async () => { try { await api("/auth/api-key", {method:"DELETE"}); $("#key-result").replaceChildren(); toast("API key revoked."); } catch(e) { error(e); } };
      }
      function mix() {
        return datasets
          .filter((d) => (draft.weights[d.id] || 0) > 0)
          .map((d) => ({ ...d, weight: draft.weights[d.id] }));
      }
      function balance(id, value) {
        const others = datasets.filter((d) => d.id !== id),
          remaining = 100 - value,
          total = others.reduce((s, d) => s + (draft.weights[d.id] || 0), 0);
        draft.weights[id] = others.length ? value : 100;
        let used = 0;
        others.forEach((d, i) => {
          const n =
            i === others.length - 1
              ? remaining - used
              : Math.floor(
                  remaining *
                    (total
                      ? (draft.weights[d.id] || 0) / total
                      : 1 / others.length),
                );
          draft.weights[d.id] = n;
          used += n;
        });
        save();
        updateMix();
      }
      function updateMix() {
        datasets.forEach((d) => {
          const input = $(`[data-slider="${d.id}"]`),
            value = draft.weights[d.id] || 0;
          if (input) {
            input.value = value;
            $(`[data-value="${d.id}"]`).textContent = value + "%";
          }
        });
        if ($("#recipe")) $("#recipe").innerHTML = recipe();
        if ($("#data-warning")) $("#data-warning").outerHTML = dataWarning();
      }
      function trainingPlan() {
        const small = draft.model_size === "small";
        const parameters = small ? 391008 : 134912;
        const context = small ? 64 : 32;
        const length = Math.min(context, ...mix().map(d => Math.floor(d.bytes * .9) - 1));
        const target = parameters * 20;
        const count = draft.budget_mode === "chinchilla" ? Math.ceil(target / (draft.batch_size * length)) : draft.steps;

            "No logs yet.";
          $("#run-actions").innerHTML =
            `${!readOnly && local && active ? '<button class="secondary" id="stop">Stop training</button>' : ""}${!readOnly && local && r.state === "finished" ? `<button class="secondary" id="publish">${r.is_public ? "Remove from leaderboard" : "Publish score to leaderboard"}</button>` : ""}${r.artifacts.map((a) => `<button class="primary" data-artifact="${a.id}">↓ Download ${esc(a.name)}</button>`).join(" ")}`;
          if ($("#publish")) $("#publish").onclick = async () => {
            try { $("#publish").disabled = true; await api("/training/" + id + "/visibility", {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({is_public:!r.is_public})}); await refresh(); } catch(e) { error(e); if ($("#publish")) $("#publish").disabled=false; }
          };
          if ($("#stop")) {
            $("#stop").disabled = r.state === "stopping";
            $("#stop").onclick = async () => {
              try {
                $("#stop").disabled = true;
                await post("/training/" + id + "/stop", {});
                await refresh();
              } catch (e) {
                error(e);
                if ($("#stop")) $("#stop").disabled = false;
              }
            };
          }
          document.querySelectorAll("[data-artifact]").forEach(
            (b) =>
              (b.onclick = async () => {
                try {
                  const response = await fetch(
                    "/api/artifacts/" + b.dataset.artifact,
                  );
                  if (!response.ok) throw Error("Download failed. Try again.");
                  if (
                    response.headers
                      .get("content-type")
                      ?.includes("application/json")
                  ) {
                    const content = await response.clone().json();
                    if (content.url) {
                      location.href = content.url;
                      return;
                    }
                  }
                  const url = URL.createObjectURL(await response.blob()),
                    a = document.createElement("a");
                  a.href = url;
                  a.download = r.artifacts.find(
                    (a) => a.id === b.dataset.artifact,
                  ).name;
                  a.click();
                  setTimeout(() => URL.revokeObjectURL(url), 1000);
                } catch (e) {
                  error(e);
                }
              }),
          );
          return active;
        }
        async function refresh() {
          clearTimeout(timer);
          try {
            const data = await api("/runs/" + id);
            if (token !== generation) return;
            $("#error")?.remove();
            if (paint(data)) timer = setTimeout(refresh, 2000);
            else if (!readOnly && local && data.state === "finished" && !$('#hf-export')) {
              $('#run-actions').closest('.actions').insertAdjacentHTML('afterend', '<section class="panel" id="hf-export" style="margin:20px 0"></section>');
              await exportPanel();
            }
          } catch (e) {
            if (token === generation) {
              error(e);
              timer = setTimeout(refresh, 5000);
            }
          }
        }
        async function exportPanel() {
          try {
            const data = await api('/training/' + id + '/huggingface');
            if (token !== generation || !$('#hf-export')) return;
            const p=data.publication, box=$('#hf-export');
            if (p?.status === 'finished') {
              box.innerHTML=`<h2>Published to Hugging Face</h2><p><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.repo_id)} ↗</a> · ${p.private ? 'Private' : 'Public'}</p><p class="muted">All uploaded files verified. Commit: ${esc(p.commit)}</p>`; return;
            }
            if (p?.status === 'uploading') {
              box.innerHTML='<h2>Publishing to SlayerLab…</h2><p class="muted">Uploading the model and verifying the committed files. You can return to this run later.</p>';
              timer=setTimeout(exportPanel,2000); return;
            }
            box.innerHTML=`<h2>Publish model to SlayerLab</h2><p>Upload the saved checkpoint to the <a href="https://huggingface.co/SlayerLab" target="_blank" rel="noopener">SlayerLab organization</a>.</p>${p?.error ? `<p class="error">${esc(p.error)}</p>` : ''}${!data.hf_username ? '<p>Connect your Hugging Face account first.</p><a class="secondary" href="#account">Connect Hugging Face →</a>' : `<p class="muted">Authorize as ${esc(data.hf_username)}. Your HF account must be allowed to create models in SlayerLab; select SlayerLab when granting organization access.</p><form id="hf-export-form"><label class="field"><span>Repository name · SlayerLab/</span><input name="repo_name" required maxlength="80" value="${esc(p?.repo_id?.split('/')[1] || data.suggested_name)}"></label><label class="field"><span>Repository visibility</span><select name="visibility"><option value="private" ${p?.private !== false ? 'selected' : ''}>Private</option><option value="public" ${p?.private === false ? 'selected' : ''}>Public — anyone can download</option></select></label><p>Files: ${data.files.map(esc).join(', ')}.</p><p class="muted">Includes model weights, byte tokenizer configuration, runnable PyTorch code and training metrics. Raw datasets, private filenames, notes and logs are excluded. This creates a new repository; existing models are not overwritten.</p><button class="primary">Authorize & publish to SlayerLab →</button></form>`}`;
            if ($('#hf-export-form')) $('#hf-export-form').onsubmit=async event=>{
              event.preventDefault(); const f=event.currentTarget, b=f.querySelector('button'); b.disabled=true;
              try { const result=await post('/training/'+id+'/huggingface',{repo_name:f.elements.repo_name.value,private:f.elements.visibility.value==='private',confirm:true}); location.assign(result.url); }
              catch(e){error(e);b.disabled=false;}
            };
          } catch(e) { if(token===generation) error(e); }
        }
        if (paint(r)) timer = setTimeout(refresh, 2000);
        if (!readOnly && local && r.state === "finished") await exportPanel();
      }
      async function compare(ids) {
        const rs = await api(
          "/compare?" +
            ids.map((id) => "ids=" + encodeURIComponent(id)).join("&"),
        );
        const keys = [
          ...new Set(rs.flatMap((r) => Object.keys(r.metrics))),
        ].filter((k) => k !== "progress");
        app.innerHTML = `<a href="#runs" class="muted">← My runs</a><div class="intro" style="margin-top:25px"><div class="eyebrow">Side by side</div><h1>See what your mix changed.</h1><p class="muted">Compare measured results. Different validation mixtures are not a like-for-like quality ranking.</p></div><div class="panel table-scroll"><table><thead><tr><th>Run</th>${rs.map((r) => `<th>${esc(r.name)}</th>`).join("")}</tr></thead><tbody>${["state", ...keys].map((k) => `<tr><td>${esc(k)}</td>${rs.map((r) => `<td>${k === "state" ? esc(r.state) : fmt(latest(r, k))}</td>`).join("")}</tr>`).join("")}<tr><td>Dataset mix</td>${rs.map((r) => `<td>${(r.config.mix || []).map((d) => `${esc(d.name)} ${d.weight}%`).join("<br>") || "—"}</td>`).join("")}</tr>${["model", "steps", "batch_size", "learning_rate", "seed"].map((k) => `<tr><td>${k}</td>${rs.map((r) => `<td>${esc(r.config[k] ?? "—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div><div class="charts" style="margin-top:20px">${keys.map((k) => `<div class="chart"><h3>${esc(k)}</h3>${chart(rs.map((r) => ({ name: r.name, points: r.metrics[k] || [] })))}</div>`).join("")}</div>`;
      }
      async function leaderboard() {
        const sort = document.querySelector("#leader-sort")?.value || "val_loss";
        const data = await api("/leaderboard?sort=" + sort + "&order=" + (sort === "throughput" ? "desc" : "asc"));
        const models = data.models;
        app.innerHTML = `<div class="intro row"><div><div class="eyebrow">Model leaderboard</div><h1>Measured progress, side by side.</h1><p class="muted">Published scores ranked by saved-checkpoint validation. Create an account to train and publish your own results.</p></div><a class="primary" href="#new">+ New training run</a></div><div class="row" style="margin-bottom:20px"><label class="field" style="margin:0;max-width:240px"><span>Rank by</span><select id="leader-sort"><option value="val_loss" ${sort === "val_loss" ? "selected" : ""}>Lowest validation loss</option><option value="perplexity" ${sort === "perplexity" ? "selected" : ""}>Lowest perplexity</option><option value="throughput" ${sort === "throughput" ? "selected" : ""}>Highest throughput</option><option value="started_at" ${sort === "started_at" ? "selected" : ""}>Newest run</option></select></label><small class="muted">Lower loss and perplexity are better.</small></div>${models.length ? `<div class="panel table-scroll"><table><thead><tr><th>#</th><th>Model</th><th>Author</th><th>Validation loss</th><th>Perplexity</th><th>Last train loss</th><th>Tokens / sec</th><th>Recipe</th></tr></thead><tbody>${models.map((r) => `<tr><td><strong>${r.rank}</strong></td><td><a href="#run/${r.id}">${esc(r.name)}</a><br><small>${new Date(r.started_at).toLocaleString()} · ${r.steps} steps</small></td><td>${esc(r.owner)}</td><td><strong>${fmt(r.val_loss)}</strong></td><td>${fmt(r.perplexity)}</td><td>${fmt(r.train_loss)}</td><td>${fmt(r.throughput, 0)}</td><td>${r.mix.map((d) => `${esc(d.name)} ${d.weight}%`).join("<br>")}</td></tr>`).join("")}</tbody></table></div>` : `<div class="panel empty"><h2>No completed models yet.</h2><p class="muted">Finish a training run and its measured validation metrics will appear here.</p><a class="primary" href="#new">Start your first run →</a></div>`}<p class="muted" style="font-size:12px;margin-top:18px">This is a smoke-test leaderboard. Scores are comparable when runs use the same validation data and model settings.</p>`;
        $("#leader-sort").onchange = leaderboard;
      }
      async function route() {
        clearTimeout(timer);
        const token = ++generation,
          hash = location.hash.slice(1) || "new";
        $("#nav-new").classList.toggle("active", hash === "new");
        $("#nav-runs").classList.toggle("active", hash === "runs" || hash.startsWith("run/") || hash.startsWith("compare/"));
        $("#nav-leaderboard").classList.toggle("active", hash === "leaderboard");
        app.innerHTML = '<p class="muted" role="status">Loading workspace…</p>';
        try {
          if (["login", "register"].includes(hash)) { authForm(hash === "register"); return; }
          if (!account && hash !== "leaderboard" && !hash.startsWith("run/")) { authNext = hash; authForm(); return; }
          if (hash === "account") { await accountPage(); return; }
          if (hash.startsWith("run/")) await detail(hash.slice(4), token);
          else if (hash.startsWith("compare/"))
            await compare(hash.slice(8).split(","));
          else if (hash === "runs") await runs();
          else if (hash === "leaderboard") await leaderboard();
          else {
            stage = 1;
            await studio();
          }
        } catch (e) {
          error(e);
          const b = document.createElement("button");
          b.className = "secondary";
          b.textContent = "Try again";
          b.onclick = route;
          app.append(b);
        }
      }
      let authReady = false;
      window.addEventListener("hashchange", () => { if (authReady) route(); });
      (async () => {
        try { account = (await api("/auth/me")).user; restoreDraft(); accountNav(); authReady=true; await route(); }
        catch(e) { error(e); }
      })();
    </script>
  </body>
</html>
