<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fabryka Track</title><style>
:root{--bg:#0d0f12;--panel:#15181d;--line:#292e37;--muted:#89919f;--text:#e9edf2;--accent:#e0ff68;--blue:#75a7ff;--red:#ff756f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 4vw;gap:18px;position:sticky;top:0;background:#0d0f12ee;z-index:2}.brand{font-weight:800;letter-spacing:-.5px}.mark{color:var(--accent)}main{max-width:1200px;margin:38px auto;padding:0 24px}h1{font:600 28px system-ui;margin:0 0 7px}h2{font:600 17px system-ui;margin:0}.muted{color:var(--muted)}.toolbar,.row{display:flex;align-items:center;gap:10px}.toolbar{margin:26px 0 14px}.grow{flex:1}input,select,textarea,button{font:inherit;color:var(--text);border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 11px}button{cursor:pointer}button.primary{background:var(--accent);color:#111;border:0;font-weight:700}button:disabled{opacity:.35}.table{border:1px solid var(--line);border-radius:8px;overflow:hidden}.tr{display:grid;grid-template-columns:38px 2fr 1fr 1fr 1fr 1fr;min-height:47px;align-items:center;padding:0 15px;border-bottom:1px solid var(--line)}.tr:last-child{border:0}.tr.head{font-size:11px;color:var(--muted);letter-spacing:.08em}.tr:not(.head):hover{background:#15181d}.link{cursor:pointer}.state-running{color:var(--accent)}.state-failed{color:var(--red)}.state-finished{color:var(--blue)}.back{color:var(--muted);cursor:pointer;margin-bottom:25px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:22px 0}.card{background:var(--panel);padding:16px}.label{font-size:11px;color:var(--muted);margin-bottom:8px}.value{font-size:16px}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:14px}.chart{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--panel)}svg{width:100%;height:170px;overflow:visible}.gridline{stroke:#30353e;stroke-width:1}.chart-title{margin-bottom:12px}.notes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.notes textarea{width:100%;min-height:115px;resize:vertical}.logs{background:#080a0c;border:1px solid var(--line);padding:14px;border-radius:8px;max-height:260px;overflow:auto;white-space:pre-wrap}.compare-table{width:100%;border-collapse:collapse;margin:20px 0}.compare-table th,.compare-table td{text-align:right;padding:11px;border-bottom:1px solid var(--line)}.compare-table th:first-child,.compare-table td:first-child{text-align:left;color:var(--muted)}@media(max-width:650px){.tr{grid-template-columns:34px 2fr 1fr 1fr}.hide-sm{display:none}.charts,.notes{grid-template-columns:1fr}main{padding:0 14px}.toolbar{flex-wrap:wrap}}
</style></head><body><header><div class="brand"><span class="mark">◆</span> FABRYKA TRACK</div><span class="muted">experiments, without the archaeology</span></header><main id="app"></main><script>
const app=document.querySelector('#app'), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(url,opt)=>{const r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.json()};
const age=d=>{let s=(Date.now()-new Date(d))/1000;for(const [n,u] of [[86400,'d'],[3600,'h'],[60,'m']])if(s>=n)return Math.floor(s/n)+u;return Math.max(0,Math.floor(s))+'s'};
const fmt=x=>typeof x==='number'?x.toLocaleString(undefined,{maximumFractionDigits:3}):esc(x??'—');
const duration=r=>{let s=(new Date(r.ended_at||Date.now())-new Date(r.started_at))/1000;return [s/3600,s%3600/60,s%60].map(x=>String(Math.floor(x)).padStart(2,'0')).join(':')};
function plot(series,names){let all=Object.values(series).flat();if(!all.length)return '<div class="muted">No data yet</div>';let min=Math.min(...all.map(x=>x.value)),max=Math.max(...all.map(x=>x.value));if(min===max){min-=1;max+=1}let xmax=Math.max(...all.map(x=>x.step),1),colors=['#e0ff68','#75a7ff','#ff756f','#c58cff'];let lines=Object.entries(series).map(([name,pts],i)=>{let p=pts.map(x=>`${18+x.step/xmax*360},${150-(x.value-min)/(max-min)*125}`).join(' ');return `<polyline points="${p}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="2"/><text x="${20+i*110}" y="168" fill="${colors[i%colors.length]}" font-size="10">${esc(names?.[name]||name)}</text>`}).join('');return `<svg viewBox="0 0 400 175" preserveAspectRatio="none"><line class="gridline" x1="18" y1="25" x2="390" y2="25"/><line class="gridline" x1="18" y1="88" x2="390" y2="88"/><line class="gridline" x1="18" y1="150" x2="390" y2="150"/>${lines}</svg>`}
let selected=new Set();
async function home(){let ps=await api('/api/projects');if(!ps.length){app.innerHTML='<h1>No runs yet</h1><p class="muted">Initialize your first run with the Python SDK.</p>';return}showRuns(ps[0].name,ps)}
async function showRuns(project,projects){history.replaceState({},'',`/?project=${encodeURIComponent(project)}`);let runs=await api(`/api/projects/${encodeURIComponent(project)}/runs`);app.innerHTML=`<div class="row"><div><h1>${esc(project)}</h1><span class="muted">${runs.length} runs</span></div><div class="grow"></div><select id="project">${projects.map(p=>`<option ${p.name===project?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="toolbar"><input id="search" placeholder="Filter runs…"><select id="state"><option value="">All states</option><option>running</option><option>finished</option><option>failed</option></select><select id="sort"><option value="started">Newest</option><option value="name">Run name</option><option value="loss">Lowest loss</option><option value="tps">Highest tok/s</option></select><div class="grow"></div><button class="primary" id="compare" disabled>Compare (<span>0</span>)</button></div><div class="table"><div class="tr head"><span></span><span>RUN</span><span>STATE</span><span>LOSS</span><span class="hide-sm">TOK/S</span><span class="hide-sm">AGE</span></div>${runs.map(r=>`<div class="tr item" data-name="${esc(r.name.toLowerCase())}" data-state="${r.state}" data-started="${new Date(r.started_at).getTime()}" data-loss="${r.latest_metrics['train/loss']??r.latest_metrics.loss??Infinity}" data-tps="${r.latest_metrics['throughput/tokens_sec']??-Infinity}"><input type="checkbox" data-id="${r.id}"><span class="link" data-run="${r.id}">${esc(r.name)}</span><span class="state-${r.state}">${r.state==='running'?'●':'✓'} ${r.state.toUpperCase()}</span><span>${fmt(r.latest_metrics['train/loss']??r.latest_metrics.loss)}</span><span class="hide-sm">${fmt(r.latest_metrics['throughput/tokens_sec'])}</span><span class="hide-sm">${age(r.started_at)}</span></div>`).join('')}</div>`;
document.querySelector('#project').onchange=e=>showRuns(e.target.value,projects);document.querySelectorAll('[data-run]').forEach(x=>x.onclick=()=>detail(x.dataset.run));document.querySelectorAll('[data-id]').forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id);let b=document.querySelector('#compare');b.disabled=selected.size<2;b.querySelector('span').textContent=selected.size});document.querySelector('#compare').onclick=()=>comparison([...selected]);let filter=()=>document.querySelectorAll('.item').forEach(x=>x.style.display=(!x.dataset.name.includes(document.querySelector('#search').value.toLowerCase())||document.querySelector('#state').value&&x.dataset.state!==document.querySelector('#state').value)?'none':'grid');document.querySelector('#search').oninput=filter;document.querySelector('#state').onchange=filter;document.querySelector('#sort').onchange=e=>{let rows=[...document.querySelectorAll('.item')],key=e.target.value,cmp=key==='name'?(a,b)=>a.dataset.name.localeCompare(b.dataset.name):key==='loss'?(a,b)=>+a.dataset.loss-+b.dataset.loss:key==='tps'?(a,b)=>+b.dataset.tps-+a.dataset.tps:(a,b)=>+b.dataset.started-+a.dataset.started;let table=document.querySelector('.table');rows.sort(cmp).forEach(x=>table.append(x))}}
async function detail(id){let r=await api('/api/runs/'+id),gpu=r.metadata.gpu_count?`${r.metadata.gpu_count}× ${r.metadata.gpu_models?.[0]}`:'—';app.innerHTML=`<div class="back" id="back">← All runs</div><div class="row"><h1>${esc(r.name)}</h1><div class="grow"></div><span class="state-${r.state}">${r.state==='running'?'●':'✓'} ${r.state.toUpperCase()}</span></div><div class="cards"><div class="card"><div class="label">STARTED</div><div class="value">${new Date(r.started_at).toLocaleString()}</div></div><div class="card"><div class="label">DURATION</div><div class="value">${duration(r)}</div></div><div class="card"><div class="label">GPU</div><div class="value">${esc(gpu)}</div></div><div class="card"><div class="label">GIT</div><div class="value">${esc(r.metadata.git_commit?.slice(0,8)||'—')}${r.metadata.git_dirty?' +':''}</div></div>${Object.entries(r.config).map(([k,v])=>`<div class="card"><div class="label">${esc(k.toUpperCase())}</div><div class="value">${fmt(v)}</div></div>`).join('')}</div><div class="charts">${Object.entries(r.metrics).map(([k,v])=>`<div class="chart"><div class="chart-title">${esc(k)}</div>${plot({[k]:v})}</div>`).join('')}</div><div class="notes"><label><div class="label">WHY THIS RUN EXISTS</div><textarea id="note">${esc(r.note)}</textarea></label><label><div class="label">CONCLUSION</div><textarea id="conclusion">${esc(r.conclusion)}</textarea></label></div><button id="save">Save notes</button><h2 style="margin:28px 0 12px">Raw logs</h2><div class="logs">${r.logs.length?r.logs.map(x=>`[${new Date(x.timestamp).toLocaleTimeString()}] ${esc(x.message)}`).join('\n'):'No logs captured.'}</div>`;document.querySelector('#back').onclick=home;document.querySelector('#save').onclick=async()=>{await api(`/api/runs/${id}/notes`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({note:document.querySelector('#note').value,conclusion:document.querySelector('#conclusion').value})});document.querySelector('#save').textContent='Saved ✓'}}
async function comparison(ids){let rs=await api('/api/compare?'+ids.map(x=>'ids='+encodeURIComponent(x)).join('&')),diff=false;let render=()=>{let cfg=[...new Set(rs.flatMap(r=>Object.keys(r.config)))],met=[...new Set(rs.flatMap(r=>Object.keys(r.metrics)))],rows=[...cfg.map(k=>[k,...rs.map(r=>r.config[k])]),...met.map(k=>[k,...rs.map(r=>r.metrics[k]?.at(-1)?.value)])];if(diff)rows=rows.filter(x=>new Set(x.slice(1).map(JSON.stringify)).size>1);app.innerHTML=`<div class="back" id="back">← All runs</div><div class="row"><h1>Compare runs</h1><div class="grow"></div><label><input type="checkbox" id="diff" ${diff?'checked':''}> Show differences only</label></div><table class="compare-table"><thead><tr><th>FIELD</th>${rs.map(r=>`<th>${esc(r.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr>${x.map(v=>`<td>${fmt(v)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="charts">${met.map(k=>`<div class="chart"><div class="chart-title">${esc(k)}</div>${plot(Object.fromEntries(rs.filter(r=>r.metrics[k]).map(r=>[r.id,r.metrics[k]])),Object.fromEntries(rs.map(r=>[r.id,r.name])))}</div>`).join('')}</div>`;document.querySelector('#back').onclick=home;document.querySelector('#diff').onchange=e=>{diff=e.target.checked;render()}};render()}
home().catch(e=>app.innerHTML=`<h1>Could not load tracker</h1><p class="muted">${esc(e.message)}</p>`);
</script></body></html>
